<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour Virtual</title>
  <link rel="stylesheet" href="./Style.css">
</head>
<body>

  <div id="loading">
    <div class="loading-ring"></div>
    <span class="loading-label">Carregando cena…</span>
  </div>

  <div id="fade-overlay"></div>

  <div id="breadcrumb">—</div>

  <div id="compass">
    <div id="compass-needle"></div>
  </div>

  <div id="toolbar">
    <button class="tool-btn" id="btn-fullscreen">
      ⛶<span class="tooltip">Tela cheia</span>
    </button>
    <button class="tool-btn" id="btn-autorotate">
      ↻<span class="tooltip">Rotação automática</span>
    </button>
    <button class="tool-btn" id="btn-share">
      ⎋<span class="tooltip">Copiar link desta cena</span>
    </button>
  </div>

  <div id="floorplan">
    <canvas id="floormap" width="160" height="140"></canvas>
    <div id="floorplan-label">Planta baixa</div>
  </div>

  <button id="back-btn">← Voltar</button>

  <nav id="minimap"></nav>

  <div id="hint">🖱 Arraste para olhar · Scroll para zoom · Clique nas setas para navegar</div>

  <!-- Pop-up de informação -->
  <div id="info-popup">
    <div id="popup-card">
      <button id="popup-close">✕</button>
      <img id="popup-img" src="" alt="">
      <div id="popup-title">—</div>
      <div id="popup-text">—</div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./script.js"></script>
</body>
</html>
